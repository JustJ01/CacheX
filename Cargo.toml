[workspace]
resolver = "2"
members = [
    "crates/cachex-core",
    "crates/cachex-server",
    "crates/cachex-client",
    "crates/cachex-bench",
    "crates/cachex-control",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "fs", "process"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
bincode = "1"
axum = { version = "0.8", features = ["json"] }