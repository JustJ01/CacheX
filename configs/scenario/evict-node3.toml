[node]
id = 3
host = "127.0.0.1"
port = 7003

[cluster]
nodes = [
    "127.0.0.1:7001",
    "127.0.0.1:7002",
    "127.0.0.1:7003",
]

[cache]
max_memory_bytes = 1048576
eviction_policy = "lru"
ttl_purge_interval_secs = 1

[aof]
enabled = false
path = "scenario-evict-node3.aof"
fsync = "interval"
fsync_interval_secs = 1
rewrite_threshold_bytes = 67108864

[hashing]
vnodes = 100

[replication]
enabled = false
factor = 1

[heartbeat]
interval_secs = 1
timeout_ms = 500
miss_threshold = 2

[metrics]
enabled = true
host = "127.0.0.1"
port = 9003